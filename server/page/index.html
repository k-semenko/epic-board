<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141a" media="(prefers-color-scheme: dark)">
<title>EpicBoard</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/static/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="topbar"><div class="topbar-in">
  <a href="/" class="brand" data-i18n-aria="nav.all"><span data-logo></span>EpicBoard</a>
  <div class="top-search"><label class="search"><span data-icon="search"></span><input id="q" type="search" data-i18n-ph="index.search" autocomplete="off"></label><div id="search-results" class="search-results" hidden></div></div>
  <a href="/feed" class="icon-btn topbar-feed" data-i18n-aria="nav.feed" data-i18n-title="nav.feed"><span data-icon="inbox"></span><span id="feed-badge" class="feed-badge" hidden></span></a>
  <a href="/settings" class="icon-btn topbar-settings" data-i18n-aria="settings.title" data-i18n-title="settings.title"><span data-icon="settings"></span></a>
  <button type="button" id="lang" class="lang-btn">RU</button>
</div></nav>
<main class="wrap">
  <header class="head">
    <div><h1 data-i18n="index.title">Epics</h1>
      <nav class="view-nav" data-i18n-aria="nav.views" aria-label="Views">
        <a href="/" aria-current="page" data-i18n="nav.epics">Epics</a>
        <a href="/tasks" data-i18n="nav.tasks">Tasks</a>
        <a href="/feed" data-i18n="nav.feed">Feed</a>
      </nav>
    </div>
    <div class="index-controls">
      <label class="sort-control float-field">
        <select id="epic-sort">
          <option value="created" data-i18n="index.sortCreated">Date created</option>
          <option value="updated" data-i18n="index.sortUpdated">Last modified</option>
        </select>
        <span data-i18n="index.sort">Sort</span>
      </label>
      <button id="epic-archive" type="button" class="archive-toggle" aria-pressed="false" hidden></button>
    </div>
  </header>
  <div id="stats" class="stats"></div>
  <div id="epics"><p class="muted" data-i18n="loading">Loading…</p></div>
</main>
<script type="module" src="/static/app.js"></script>
</body>
</html>
