<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141a" media="(prefers-color-scheme: dark)">
<title>EpicBoard</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/static/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="topbar"><div class="topbar-in">
  <a href="/" class="brand" data-i18n-aria="nav.all"><span data-logo></span>EpicBoard</a>
  <div class="top-search"><label class="search"><span data-icon="search"></span><input id="q" type="search" data-i18n-ph="epic.search" autocomplete="off"></label><div id="search-results" class="search-results" hidden></div></div>
  <a href="/feed" class="icon-btn topbar-feed" data-i18n-aria="nav.feed" data-i18n-title="nav.feed"><span data-icon="inbox"></span><span id="feed-badge" class="feed-badge" hidden></span></a>
  <a href="/settings" class="icon-btn topbar-settings" data-i18n-aria="settings.title" data-i18n-title="settings.title"><span data-icon="settings"></span></a>
  <button type="button" id="lang" class="lang-btn">RU</button>
  <a href="https://github.com/k-semenko/epic-board" class="icon-btn topbar-repo" target="_blank" rel="noopener noreferrer" data-i18n-aria="nav.repo" data-i18n-title="nav.repo"><span data-icon="git"></span></a>
</div></nav>
<main class="wrap" id="epic">
  <header class="head">
    <div class="head-title-row">
      <div class="epic-heading">
        <p id="epic-id" class="epic-id mono muted" hidden></p>
        <h1 id="title" data-i18n="loading">Loading…</h1>
      </div>
      <div class="actions">
        <span id="updated" class="icon-btn updated-stamp muted" role="img" hidden></span>
        <button id="archive-epic" type="button" class="live-only" hidden><span data-icon="check"></span><span data-i18n="archive.button">Done</span></button>
        <button id="refresh-all" type="button" class="live-only"><span data-icon="refresh"></span><span data-i18n="epic.refreshAll">Refresh all</span></button>
        <a id="export-link" class="button live-only" href="#" download data-i18n-title="epic.exportTip"><span data-icon="download"></span><span data-i18n="epic.export">Export</span></a>
      </div>
    </div>
    <p id="goal" class="muted"></p>
  </header>
  <p id="export-note" class="export-note" hidden></p>
  <div id="archived-note" class="archived-note" hidden></div>
  <section class="waiting-section" data-section="waiting"><h2><span data-i18n="sec.waiting">Needs decision</span> <span id="waiting-count" class="waiting-counts"></span></h2><ul id="waiting" class="list"></ul><div id="waiting-pagination"></div><div id="waiting-announcement" class="sr-only" role="status" aria-live="polite"></div></section>
  <section class="map-section" data-section="map"><div class="section-head"><h2 data-i18n="sec.map">Map</h2>
    <div class="map-tools">
      <button type="button" data-fullscreen><span data-icon="expand"></span><span data-i18n="map.full">Full screen</span></button>
    </div></div>
    <div class="map-frame" id="map-frame"><div id="map" class="map"></div></div></section>
  <section data-section="branches"><h2 data-i18n="sec.branches">Branches and merge requests</h2><div class="scroll"><table id="branches"></table></div></section>
  <section data-section="sessions"><h2 data-i18n="sec.sessions">Sessions</h2><ul id="sessions" class="list"></ul></section>
  <section data-section="decisions"><h2 data-i18n="sec.decisions">Decisions</h2><ul id="decisions" class="list"></ul><div id="decisions-pagination"></div></section>
  <section data-section="history"><h2 data-i18n="sec.history">History</h2><ul id="history" class="list history"></ul><div id="history-pagination"></div></section>
</main>
<div id="popover" class="popover" role="dialog" hidden></div>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
