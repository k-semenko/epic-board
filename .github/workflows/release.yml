name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build and publish release
    # Tags are protected; forks never reach the self-hosted runner.
    if: github.repository == 'k-semenko/epic-board'
    runs-on: [self-hosted, linux, epic-board]
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag matches versions and CHANGELOG
        run: node scripts/release/check-versions.mjs --tag "$GITHUB_REF_NAME"

      - run: npm test

      - run: npm run check

      - name: Pack tarball and SHA256SUMS
        run: node scripts/release/pack.mjs

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/epic-board-${{ github.ref_name }}.tar.gz

      - name: Extract release notes
        run: node scripts/release/notes.mjs "${GITHUB_REF_NAME#v}" > dist/notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/epic-board-${GITHUB_REF_NAME}.tar.gz" dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/notes.md \
            --verify-tag "${flags[@]}"
